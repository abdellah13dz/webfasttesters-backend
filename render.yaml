# Render Blueprint — use when deploying this folder as its own repo root
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fasttesters-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Use Supabase SESSION pooler — NOT db.*.supabase.co (IPv6-only, fails on Render)
      # postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_POOLER_REGION
        value: eu-west-1
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://fasttesters.com
      - key: SITE_URL
        value: https://fasttesters.com
      - key: ALLOWED_ORIGINS
        value: https://fasttesters.com,https://www.fasttesters.com
